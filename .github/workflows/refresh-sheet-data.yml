name: Refresh planner sheet snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-planner-sheet-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth

      - name: Write the Google service account securely
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"

      - name: Refresh the snapshot when sheet rows changed
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/google-service-account.json
        run: python tools/refresh_sheet_data.py --only-if-changed

      - name: Publish changed planner data
        run: |
          if git diff --quiet -- sheet-data.json; then
            echo "Planner data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet-data.json
          git commit -m "Refresh planner sheet snapshot"
          git push origin HEAD:main
