<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09070b" />
    <title>Payment Tracker Location Map</title>
    <link rel="icon" type="image/png" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="location-map.css?v=20260504-map-ui-1" />
  </head>
  <body>
    <main class="location-app">
      <section class="map-login" id="mapLogin">
        <form class="map-login-card" id="mapLoginForm">
          <img src="assets/logo-white-red.png" alt="" />
          <p>Admin Location Map</p>
          <h1>Sign in to view live users</h1>
          <label>
            Admin ID
            <input id="mapLoginId" type="text" autocomplete="username" placeholder="Enter admin ID" required />
          </label>
          <label>
            Password
            <input id="mapLoginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required />
          </label>
          <button type="submit">Open Map</button>
          <b id="mapLoginError" hidden>Admin login only.</b>
        </form>
      </section>

      <section class="map-shell" id="mapShell" hidden>
        <aside class="map-panel">
          <div class="map-panel-top">
            <div class="map-title-lockup">
              <img src="assets/logo-white-red.png" alt="" />
              <div>
                <p>Payment Tracker</p>
                <h1>Live Map</h1>
              </div>
            </div>
            <button id="mapRefreshButton" type="button">Refresh</button>
          </div>
          <div class="map-status" id="mapStatus">Waiting for user locations...</div>
          <div class="map-meta-row">
            <div class="map-refresh-note" id="mapRefreshNote">Auto-refresh active.</div>
            <button id="historyToggleButton" type="button">Hide History</button>
          </div>
          <div class="map-debug" id="mapDebug">Map script loading...</div>
          <div class="user-location-list" id="userLocationList"></div>
          <button class="map-signout" id="mapSignOutButton" type="button">Sign out</button>
        </aside>
        <section class="map-canvas-wrap">
          <div id="locationMap" aria-label="Live user location map"></div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="users.js?v=20260504-map-ui-1"></script>
    <script src="location-map.js?v=20260504-map-ui-1"></script>
  </body>
</html>
